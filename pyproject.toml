[build-system]
requires = [
  "scikit-build-core>=0.8",
  "pybind11>=2.12"
]
build-backend = "scikit_build_core.build"

[project]
name = "gapese"
version = "0.1.0"
description = "C++/Eigen implementation of the Gapese solver for CCQP"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
sparse = ["scipy>=1.8"]
test = ["pytest>=7", "scipy>=1.8"]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = ["-DGAPESE_BUILD_TESTS=OFF", "-DGAPESE_BUILD_PYTHON=ON"]
wheel.packages = []
